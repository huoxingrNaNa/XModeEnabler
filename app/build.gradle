plugins { id 'com.android.application' }

// ────────────────────────────────────────────────────────────────
// 正式签名：凭据放在项目根目录的 keystore.properties（不进版本库）
// 文件缺失时自动降级为「无签名」，不影响 debug 构建，也不会编译失败。
// ────────────────────────────────────────────────────────────────
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { stream -> keystoreProps.load(stream) }
}
def hasReleaseKey = keystorePropsFile.exists() && keystoreProps['storeFile'] != null

android {
    namespace 'com.operit.xmode'
    compileSdk 36

    defaultConfig {
        applicationId "com.operit.xmode"
        minSdk 26
        targetSdk 36
        versionCode 20
        versionName "1.6.9"
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}